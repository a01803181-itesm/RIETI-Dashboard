<!--

<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión de Reportes Municipal - Rieti</title>
        <link rel="stylesheet" href="./css/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <!-- Carga de Chart.js -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body id="indexBody">
        
        <!-- Menú Lateral Sidebar -->
        <aside id="menu">
            <div id="perfil-de-usuario">
                <img src="./imagenes/perfil-de-usuario.webp" alt="Usuario" width="24" height="24">
                <p id="nombre-usuario">Cargando...</p>
            </div>

            <div id="panelControl">
                <h1 id="tituloRieti">ALIMENTADOR</h1>
                <p id="textoPanel">Panel de control</p>
            </div>

            <nav id="lista-menu">
                <ul>
                    <li><a href="dashboard_procurador.html"><img src="./imagenes/dashboard.svg" alt="Icono" width="16"><span>Dashboard</span></a></li>
                    <li style="background-color: #f1f5f9;"><a href="gestion_reportes_alimentador.html"><img src="./imagenes/reportes.png" alt="Icono" width="16"><span>Gestión de reportes</span></a></li>
                    <li><a href="estadisticas_procurador.html"><img src="./imagenes/estadisticas.webp" alt="Icono" width="16"><span>Estadísticas</span></a></li>
                    <li id="cerrar-sesion"><a href="index.html"><img src="./imagenes/sesion.png" alt="Icono" width="16"><span>Cerrar Sesión</span></a></li>
                </ul>
            </nav>
        </aside>
            
        <!-- Área de Contenido Principal -->
        <main id="pagina">
            <header id="header-pagina">
                <div id="header-gestion">
                    <h1>Gestión de Reportes Municipales</h1>
                    <p style="color: #64748b; margin-top: 4px;">Atizapán de Zaragoza</p>
                </div>
            </header>

            <!-- Buscador y tabla para consultar los reportes locales del alimentador. -->
            <section id="contenedor-tabla">
                <div id="contenedor-header-tabla">
                    <div id="header-tabla">
                        <h1>Listado de Reportes Locales</h1>
                        <p>Consulta de incidencias en Atizapán</p>
                    </div>
                    <label id="contenedor-buscador">
                        <!-- El módulo de gestión aplica el filtro de texto sobre las filas creadas. -->
                        <input id="buscador" type="search" placeholder="Ingrese Folio">
                        <button id="botonBuscar"><i class="fas fa-search"></i></button>
                    </label>
                </div>

                <div class="scrollableWrapper">
                    <div class="scrollableContent">
                        <table>
                            <thead>
                                <tr>
                                    <th>Folio</th>
                                    <th>Municipio</th>
                                    <th>Fecha</th>
                                    <th>Status</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo-tabla">
                                <!-- appGestionReportesAlimentador.mjs consulta y renderiza los reportes. -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>

        <!-- Carga identidad del usuario, métricas y reportes municipales. -->
        <script type="module" src="./js/navegacion.mjs"></script>
        <script type="module" src="./js/appGraficasAlimentador.mjs"></script>
        <script type="module" src="./js/appGestionReportesAlimentador.mjs"></script>
        <!-- <script type="module" src="./js/appGestionReportes.mjs"></script> -->
    </body>
</html>
