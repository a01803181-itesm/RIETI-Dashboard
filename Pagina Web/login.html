<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inicio de sesión - Rieti</title>
        <link rel="stylesheet" href="/css/style.css">
        <script type="module" src="/js/login.mjs"></script>
    </head>
    <body id="body-login">
        <!-- Apartado para el título de la página principal -->
        <header id="header-login">
            <h1>Rieti</h1>
        </header>
        
        <!-- Apartado para la pantalla de inicio de sesión -->
        <main id="main-login">
            <div id="contenedorLogin">
                <div id="mainHeader">
                    <h1>Iniciar Sesión</h1>
                    <p>Ingresa tus datos para continuar.</p>
                </div>
            
            
                <div id="campo-input">
                    <label for="email">Correo electrónico</label>
                    <input id="email" type="text" placeholder="rieti@email.com">
                </div>
                
                <div id="campo-input">
                    <label for="telefono">Teléfono</label>
                    <input id="telefono" type="tel" placeholder="5561352747">
                </div>

                <input id="botonIniciarSesion" type="button" value="Iniciar Sesión">
            </div>
        </main>
        
        <!-- Apartado para el pie de la página web -->
        <footer>
            <p>© 2026 Rieti. Todos los derechos reservados.</p>
        </footer>
    </body>
</html>
